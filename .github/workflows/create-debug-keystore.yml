name: Crea debug keystore (una tantum)

# Genera UNA VOLTA il keystore di debug e ti restituisce:
#   - debug.keystore              il file
#   - debug.keystore.base64.txt   da incollare nel secret DEBUG_KEYSTORE_BASE64
#   - impronte.txt                SHA-1 e SHA-256 da registrare su Firebase
#
# Serve perche' le impronte di firma devono restare STABILI: Firebase autorizza
# Google Sign-In e Phone Auth in base a package name + impronta del certificato.
#
# Procedura:
#   1. Actions > "Crea debug keystore (una tantum)" > Run workflow
#   2. Scarica l'artifact "debug-keystore"
#   3. Settings > Secrets and variables > Actions > New repository secret
#      Nome: DEBUG_KEYSTORE_BASE64   Valore: il contenuto di debug.keystore.base64.txt
#   4. Registra SHA-1 e SHA-256 su Firebase, riscarica google-services.json
#
# Da qui in poi ogni build usa lo stesso keystore e le impronte non cambiano piu'.

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Genera keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          base64 -w0 debug.keystore > debug.keystore.base64.txt

          {
            echo "Impronte da registrare su Firebase Console"
            echo "Progetto: family-tracker-social"
            echo "Package:  com.aistudio.familyradar.rkwvpm"
            echo
            keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              | grep -E "SHA1:|SHA256:"
          } > impronte.txt

          cat impronte.txt

      - name: Pubblica artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: |
            debug.keystore
            debug.keystore.base64.txt
            impronte.txt
          retention-days: 1
