<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Family Radar</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    /* ── Token palette identici a RadarDark / Color.kt ──────────────────── */
    :root {
      --bg:          #000000;          /* RadarDark.Bg = Color.Black         */
      --surface:     rgba(113,113,122,.04); /* RadarDark.Card                */
      --surface-var: rgba(255,255,255,.055);/* RadarDark.Surface             */
      --border:      rgba(255,255,255,.12); /* RadarDark.CardBorder          */
      --border-sub:  rgba(255,255,255,.10); /* OutlineDark                   */
      --text:        #F2F2F7;          /* RadarDark.TextPrimary             */
      --muted:       #A1A1AA;          /* RadarDark.TextMuted               */
      --accent:      #4F46E5;          /* RadarDark.Accent = Indigo600      */
      --accent-lt:   #6366F1;          /* RadarDark.AccentLight = Indigo500 */
      --online:      #22C55E;
      --error:       #F87171;
      /* gradient Ink800→Ink900 = DarkGradients.heroTop/Bottom */
      --ink800:      #111827;
      --ink900:      #0A0E17;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      /* Roboto / system-ui — RadarTypography usa FontFamily.Default */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── MAP ─────────────────────────────────────────────────────────────── */
    #map {
      position: absolute;
      inset: 0;
    }

    /* Rimuove attribuzione MapLibre */
    .maplibregl-ctrl-attrib { display: none !important; }
    .maplibregl-ctrl-logo   { display: none !important; }

    /* ── TOP BAR  (gradient scrim come nell'app) ─────────────────────────── */
    #topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 5;
      padding: 16px 16px 40px;
      background: linear-gradient(to bottom, rgba(0,0,0,.75) 0%, transparent 100%);
      pointer-events: none;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    #topbar-title {
      font-size: 18px;        /* titleLarge */
      font-weight: 700;
      letter-spacing: 0;
      line-height: 24px;
    }

    #topbar-sub {
      font-size: 12px;        /* bodySmall */
      font-weight: 400;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: .2px;
    }

    #logout-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 6;
      pointer-events: all;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;     /* Radius.sm */
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      cursor: pointer;
      display: none;
      letter-spacing: .1px;
    }
    #logout-btn:hover { background: var(--surface-var); }

    /* ── LOGIN OVERLAY ───────────────────────────────────────────────────── */
    #overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 24px;
    }

    .auth-root {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Header titolo + tagline */
    .auth-title {
      width: 100%;
      font-size: 22px;          /* headlineMedium */
      font-weight: 600;
      letter-spacing: 0;
      line-height: 28px;
      padding: 0 4px 4px;
    }

    .auth-tagline {
      width: 100%;
      font-size: 14px;          /* bodyMedium */
      font-weight: 500;
      color: var(--muted);
      padding: 0 4px;
      line-height: 20px;
      letter-spacing: .15px;
    }

    /* Animazione radar pulsante — CSS replica di RadarPulseAnimation */
    .radar-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
    }

    .radar-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--accent);
      animation: radar-pulse 2.4s ease-out infinite;
    }
    .radar-ring:nth-child(1) { animation-delay: 0s; }
    .radar-ring:nth-child(2) { animation-delay: .8s; }
    .radar-ring:nth-child(3) { animation-delay: 1.6s; }

    @keyframes radar-pulse {
      0%   { width: 56px; height: 56px; opacity: .7; }
      100% { width: 150px; height: 150px; opacity: 0; }
    }

    /* Centro del radar */
    .radar-center {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 85%, transparent) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      box-shadow: 0 0 0 4px rgba(79,70,229,.2);
    }

    .radar-icon {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: #fff;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Card login — surface + outline-border + radius 24dp */
    .auth-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;         /* RoundedCornerShape(24.dp) */
      padding: 20px;               /* Spacing.xl */
      display: flex;
      flex-direction: column;
      gap: 16px;                   /* Spacing.lg */
    }

    /* Pulsante Google — stesso stile dell'app: bianco, testo nero, h52, radius 14 */
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .1px;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn-google:hover   { opacity: .92; }
    .btn-google:active  { opacity: .80; }
    .btn-google:disabled { opacity: .5; cursor: default; }

    /* Google "G" SVG */
    .google-g {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Divisore "oppure" — LabeledDivider */
    .divider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .divider-row hr {
      flex: 1;
      border: none;
      border-top: 1px solid var(--border-sub);
    }
    .divider-row span {
      font-size: 11px;         /* labelSmall */
      font-weight: 500;
      color: var(--muted);
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    /* Note privacy */
    .auth-note {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      padding: 0 12px;
      line-height: 17px;
      margin-top: 8px;
    }

    /* ── Messaggio errore / spinner ──────────────────────────────────────── */
    .err-msg {
      font-size: 13px;
      color: var(--error);
      text-align: center;
      padding: 4px 0;
      display: none;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(0,0,0,.2);
      border-top-color: #000;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── MARKER MEMBRES ─────────────────────────────────────────────────── */
    .marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(-4px);
      pointer-events: none;
    }

    .marker .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 4px rgba(79,70,229,.25);
      background: var(--accent-lt);
    }

    .marker .name {
      margin-top: 4px;
      font-size: 11px;       /* labelSmall */
      font-weight: 600;
      letter-spacing: .4px;
      background: rgba(0,0,0,.65);
      padding: 2px 7px;
      border-radius: 999px;
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,.12);
    }

    .marker .spd {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Top bar -->
  <div id="topbar">
    <div>
      <div id="topbar-title">Family Radar</div>
      <div id="topbar-sub">—</div>
    </div>
  </div>
  <button id="logout-btn">Esci</button>

  <!-- Login overlay -->
  <div id="overlay">
    <div class="auth-root">

      <div class="auth-title">Family Radar</div>
      <div class="auth-tagline">Cruscotto di sola lettura. Accedi con lo stesso account Google dell'app.</div>

      <!-- Animazione radar -->
      <div class="radar-wrap">
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <div class="radar-center">
          <!-- Share Location icon (Material) -->
          <svg class="radar-icon" viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
            <circle cx="12" cy="9" r="2.5" fill="#fff" stroke="none"/>
            <path d="M18 8.5l3-1.5-3-1.5" stroke="#fff" stroke-width="1.5" fill="none"/>
            <line x1="21" y1="7" x2="15" y2="7" stroke="#fff" stroke-width="1.5"/>
          </svg>
        </div>
      </div>

      <!-- Card con bottone Google -->
      <div class="auth-card">

        <button class="btn-google" id="loginBtn">
          <!-- Google G colorata disegnata inline -->
          <svg class="google-g" viewBox="0 0 24 24" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span id="loginLabel">Accedi con Google</span>
          <div class="spinner" id="loginSpinner" style="display:none;border-top-color:#4F46E5;border-color:rgba(79,70,229,.2);border-top-color:#4F46E5;"></div>
        </button>

        <div class="divider-row">
          <hr/><span>sola lettura</span><hr/>
        </div>

        <div style="font-size:13px;color:var(--muted);text-align:center;line-height:18px;">
          I dati della famiglia restano privati.<br>
          Solo i membri del gruppo possono accedere.
        </div>

        <div class="err-msg" id="err"></div>
      </div>

      <div class="auth-note">
        Nessun dato viene condiviso con terze parti.
      </div>

    </div>
  </div>

  <!-- Firebase JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <!-- Config Firebase (da creare con le proprie chiavi) -->
  <script src="./config.js"></script>

  <script>
    const cfg = window.FIREBASE_CONFIG;
    const errEl  = document.getElementById('err');
    const subEl  = document.getElementById('topbar-sub');

    if (!cfg || !cfg.apiKey) {
      errEl.style.display = 'block';
      errEl.textContent   = 'Manca config.js con le chiavi Firebase. Vedi le istruzioni nel repo.';
    } else {
      firebase.initializeApp(cfg);
    }

    const auth = cfg?.apiKey ? firebase.auth()      : null;
    const db   = cfg?.apiKey ? firebase.firestore() : null;

    /* ── MAPPA ─────────────────────────────────────────────────────────── */
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/bright',
      center: [12.4964, 41.9028],
      zoom: 5,
      attributionControl: false
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

    let styleReady = false;
    map.on('load', () => {
      styleReady = true;
      map.addSource('trails', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'trails', type: 'line', source: 'trails',
        paint: {
          'line-color': '#6366F1',
          'line-width': 3,
          'line-opacity': 0.65
        },
        layout: { 'line-cap': 'round', 'line-join': 'round' }
      });
    });

    /* ── MARKER ────────────────────────────────────────────────────────── */
    const markers = {};
    let firstFit  = false;

    function render(locs) {
      // Scie
      if (styleReady) {
        const feats = locs
          .filter(l => (l.recentPoints || []).length >= 2)
          .map(l => ({
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates: l.recentPoints.slice().sort((a, b) => a.t - b.t).map(p => [p.lo, p.la])
            }
          }));
        const src = map.getSource('trails');
        if (src) src.setData({ type: 'FeatureCollection', features: feats });
      }

      const seen   = new Set();
      const bounds = new maplibregl.LngLatBounds();
      let any = false;

      locs.forEach(l => {
        if (!l.latitude && !l.longitude) return;
        seen.add(l.userId);

        const spdKmh = Math.round((l.speed || 0) * 3.6);
        const label  = l.nickname || l.userName || 'Membro';

        if (!markers[l.userId]) {
          const el = document.createElement('div');
          el.className = 'marker';
          el.innerHTML = `
            <div class="dot"></div>
            <div class="name"></div>
            <div class="spd"></div>`;
          markers[l.userId] = new maplibregl.Marker({ element: el })
            .setLngLat([l.longitude, l.latitude])
            .addTo(map);
        }

        const m  = markers[l.userId];
        m.setLngLat([l.longitude, l.latitude]);
        const el = m.getElement();
        el.querySelector('.name').textContent = label;
        el.querySelector('.spd').textContent  = spdKmh > 2 ? `${spdKmh} km/h` : '';

        bounds.extend([l.longitude, l.latitude]);
        any = true;
      });

      Object.keys(markers).forEach(uid => {
        if (!seen.has(uid)) { markers[uid].remove(); delete markers[uid]; }
      });

      if (any && !firstFit) {
        firstFit = true;
        try { map.fitBounds(bounds, { padding: 80, maxZoom: 16 }); } catch (_) {}
      }
    }

    /* ── FIRESTORE LISTENER ────────────────────────────────────────────── */
    let unsubUser = null, unsubLoc = null;

    function listenGroup(gid) {
      if (unsubLoc) { unsubLoc(); unsubLoc = null; }
      if (!gid) { subEl.textContent = 'Nessun gruppo attivo'; return; }

      unsubLoc = db.collection('groups').doc(gid).collection('locations')
        .onSnapshot(snap => {
          const locs = snap.docs.map(d => {
            const x = d.data();
            return {
              userId:       x.userId || d.id,
              userName:     x.userName,
              nickname:     x.nickname,
              latitude:     x.latitude  || 0,
              longitude:    x.longitude || 0,
              speed:        x.speed     || 0,
              recentPoints: (x.recentPoints || []).map(p => ({ la: p.la, lo: p.lo, t: p.t || 0 }))
            };
          });
          subEl.textContent = `${locs.length} ${locs.length === 1 ? 'membro' : 'membri'} · live`;
          render(locs);
        }, e => { subEl.textContent = 'Errore: ' + e.code; });
    }

    /* ── AUTH ──────────────────────────────────────────────────────────── */
    const loginBtn     = document.getElementById('loginBtn');
    const loginLabel   = document.getElementById('loginLabel');
    const loginSpinner = document.getElementById('loginSpinner');
    const logoutBtn    = document.getElementById('logout-btn');

    loginBtn.onclick = () => {
      if (!auth) return;
      errEl.style.display = 'none';
      loginLabel.textContent  = 'Connessione…';
      loginSpinner.style.display = '';
      loginBtn.disabled = true;
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(e => {
          errEl.style.display = 'block';
          errEl.textContent   = 'Accesso fallito: ' + (e.code || e.message);
        })
        .finally(() => {
          loginLabel.textContent  = 'Accedi con Google';
          loginSpinner.style.display = 'none';
          loginBtn.disabled = false;
        });
    };

    logoutBtn.onclick = () => auth && auth.signOut();

    auth && auth.onAuthStateChanged(user => {
      const overlay = document.getElementById('overlay');
      if (user) {
        overlay.style.display = 'none';
        logoutBtn.style.display = '';

        if (unsubUser) unsubUser();
        unsubUser = db.collection('users').doc(user.uid)
          .onSnapshot(doc => {
            const gid = doc.exists ? (doc.data().currentGroupId || null) : null;
            listenGroup(gid);
          }, e => { subEl.textContent = 'Errore: ' + e.code; });
      } else {
        overlay.style.display = 'flex';
        logoutBtn.style.display = 'none';
        subEl.textContent = '—';
        if (unsubUser) { unsubUser(); unsubUser = null; }
        if (unsubLoc)  { unsubLoc();  unsubLoc  = null; }
        render([]);
      }
    });
  </script>
</body>
</html>
