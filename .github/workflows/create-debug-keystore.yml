name: Crea debug keystore (una tantum)

# Genera UNA VOLTA il keystore di debug e lo COMMITTA nel repo (debug.keystore),
# poi stampa SHA-1 e SHA-256 nel log.
#
# Perche' nel repo e non come artifact o secret: gli artifact GitHub vengono
# serviti tramite redirect su Azure Blob Storage, che le reti aziendali bloccano
# di frequente. Committandolo non devi scaricare ne' incollare nulla.
#
# Perche' serve un keystore FISSO: Firebase autorizza Google Sign-In e Phone Auth
# in base a package name + impronta del certificato di firma. keytool genera una
# chiave nuova a ogni esecuzione, quindi rigenerarlo a ogni build invaliderebbe
# le impronte registrate in console.
#
# NOTA DI SICUREZZA: e' una chiave di DEBUG, con la password standard di Android
# ("android"), non firma nulla che finisca sul Play Store. Va bene averla nel repo
# se il repository e' PRIVATO. Se il repo e' pubblico, non usare questo workflow:
# usa invece il secret DEBUG_KEYSTORE_BASE64 (build-apk.yml lo supporta gia').
#
# Uso: Actions > questo workflow > Run workflow. Poi leggi le impronte nel log.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verifica se esiste gia'
        id: check
        run: |
          if [ -f debug.keystore ]; then
            echo "esiste=true" >> "$GITHUB_OUTPUT"
            echo "::notice::debug.keystore e' gia' nel repo. Non lo rigenero: ne creerei uno con impronte diverse."
          else
            echo "esiste=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Genera keystore
        if: steps.check.outputs.esiste == 'false'
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Committa il keystore
        if: steps.check.outputs.esiste == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f perche' .gitignore esclude debug.keystore
          git add -f debug.keystore
          git commit -m "Aggiunge debug.keystore fisso per impronte di firma stabili"
          git push

      - name: Impronte da registrare su Firebase
        run: |
          echo "=================================================================="
          echo " Progetto Firebase : family-tracker-social"
          echo " Package name      : com.aistudio.familyradar.rkwvpm"
          echo "=================================================================="
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            | grep -E "SHA1:|SHA256:"
          echo "=================================================================="
          echo " Registrale in: Impostazioni progetto > Le tue app > Android"
          echo " > Aggiungi impronta digitale. Poi riscarica google-services.json."
          echo "=================================================================="
