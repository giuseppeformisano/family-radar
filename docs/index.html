<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Family Radar</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    /* ── Token identici a RadarDark / Color.kt ─────────────────────────── */
    :root {
      --bg:        #000000;
      --surface:   rgba(113,113,122,.04);
      --surf-var:  rgba(255,255,255,.055);
      --border:    rgba(255,255,255,.12);
      --text:      #F2F2F7;
      --muted:     #A1A1AA;
      --accent:    #4F46E5;
      --accent-lt: #6366F1;
      --online:    #22C55E;
      --error:     #F87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── MAP ────────────────────────────────────────────────────────────── */
    #map { position: absolute; inset: 0; }
    .maplibregl-ctrl-attrib,
    .maplibregl-ctrl-logo { display: none !important; }

    /* ── TOP BAR ─────────────────────────────────────────────────────────── */
    #topbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      padding: 16px 16px 48px;
      background: linear-gradient(to bottom, rgba(0,0,0,.72) 0%, transparent 100%);
      pointer-events: none;
    }
    #topbar-title { font-size: 17px; font-weight: 700; line-height: 24px; }
    #topbar-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }

    #logout-btn {
      position: absolute; top: 12px; right: 14px; z-index: 6;
      pointer-events: all;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-size: 13px; font-weight: 600;
      padding: 8px 14px; cursor: pointer; display: none;
    }
    #logout-btn:hover { background: var(--surf-var); }

    /* ── LOGIN OVERLAY ──────────────────────────────────────────────────── */
    #overlay {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      padding: 24px;
    }

    /* Contenitore centrato, max 340px */
    .auth-root {
      width: 100%; max-width: 340px;
      display: flex; flex-direction: column; align-items: center;
      gap: 0;
    }

    /* ── ANIMAZIONE RADAR (replica CSS di RadarPulseAnimation) ────────── */
    .radar-wrap {
      position: relative; width: 180px; height: 180px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 28px;
    }
    .radar-ring {
      position: absolute; border-radius: 50%;
      border: 1.5px solid var(--accent);
      animation: rpulse 2.6s ease-out infinite;
    }
    .radar-ring:nth-child(1) { animation-delay: 0s; }
    .radar-ring:nth-child(2) { animation-delay: .87s; }
    .radar-ring:nth-child(3) { animation-delay: 1.73s; }
    @keyframes rpulse {
      0%   { width: 68px; height: 68px; opacity: .75; }
      100% { width: 180px; height: 180px; opacity: 0; }
    }
    .radar-center {
      width: 68px; height: 68px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, rgba(79,70,229,.82) 100%);
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 1;
      box-shadow: 0 0 0 5px rgba(79,70,229,.18);
    }
    .radar-center svg {
      width: 30px; height: 30px;
      fill: none; stroke: #fff; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── WORDMARK ─────────────────────────────────────────────────────── */
    .auth-title {
      font-size: 28px; font-weight: 700; letter-spacing: -.25px;
      line-height: 34px; text-align: center; margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px; color: var(--muted); text-align: center;
      line-height: 20px; margin-bottom: 32px;
    }

    /* ── PULSANTE GOOGLE ─────────────────────────────────────────────── */
    .btn-google {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; height: 54px;
      background: #fff; color: #111;
      border: none; border-radius: 16px;
      font-size: 15px; font-weight: 600; letter-spacing: .1px;
      cursor: pointer; transition: opacity .15s;
      margin-bottom: 20px;
    }
    .btn-google:hover  { opacity: .92; }
    .btn-google:active { opacity: .80; }
    .btn-google:disabled { opacity: .5; cursor: default; }

    .google-g { width: 20px; height: 20px; flex-shrink: 0; }

    /* Spinner dentro il bottone Google */
    .g-spinner {
      width: 20px; height: 20px; flex-shrink: 0;
      border: 2px solid rgba(79,70,229,.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── NOTA PRIVACY ────────────────────────────────────────────────── */
    .auth-note {
      font-size: 11px; color: var(--muted); text-align: center;
      line-height: 16px; opacity: .7; margin-top: 4px;
    }

    /* ── ERRORE ──────────────────────────────────────────────────────── */
    .err-msg {
      font-size: 13px; color: var(--error); text-align: center;
      margin-top: 12px; display: none;
    }

    /* ── MARKER MEMBRI ───────────────────────────────────────────────── */
    .marker { display: flex; flex-direction: column; align-items: center; transform: translateY(-4px); pointer-events: none; }
    .marker .dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 4px rgba(79,70,229,.25);
      background: var(--accent-lt);
    }
    .marker .name {
      margin-top: 4px; font-size: 11px; font-weight: 600; letter-spacing: .3px;
      background: rgba(0,0,0,.65); padding: 2px 7px; border-radius: 999px;
      white-space: nowrap; border: 1px solid rgba(255,255,255,.12);
    }
    .marker .spd { font-size: 10px; color: var(--muted); margin-top: 1px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="topbar">
    <div id="topbar-title">Family Radar</div>
    <div id="topbar-sub">—</div>
  </div>
  <button id="logout-btn">Esci</button>

  <!-- ── Login ──────────────────────────────────────────────────────────── -->
  <div id="overlay">
    <div class="auth-root">

      <!-- Animazione radar -->
      <div class="radar-wrap">
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <div class="radar-center">
          <!-- ShareLocation icon -->
          <svg viewBox="0 0 24 24">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#fff" opacity=".9"/>
            <circle cx="12" cy="9" r="2.5" fill="#4F46E5"/>
            <line x1="17" y1="8" x2="21" y2="8" stroke="#fff" stroke-width="1.6"/>
            <polyline points="19,6 21,8 19,10" stroke="#fff" stroke-width="1.6" fill="none"/>
          </svg>
        </div>
      </div>

      <!-- Wordmark -->
      <div class="auth-title">Family Radar</div>
      <div class="auth-sub">Dove sono tutti, in tempo reale.</div>

      <!-- Pulsante Google -->
      <button class="btn-google" id="loginBtn">
        <svg class="google-g" id="loginG" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <div class="g-spinner" id="loginSpinner"></div>
        <span id="loginLabel">Accedi con Google</span>
      </button>

      <div class="auth-note">Accedi con lo stesso account Google dell'app.</div>
      <div class="err-msg" id="err"></div>

    </div>
  </div>

  <!-- Firebase JS SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="./config.js"></script>

  <script>
    const cfg   = window.FIREBASE_CONFIG;
    const errEl = document.getElementById('err');
    const subEl = document.getElementById('topbar-sub');

    if (!cfg?.apiKey) {
      errEl.style.display = 'block';
      errEl.textContent   = 'Manca config.js. Aggiungi le chiavi Firebase e ricarica.';
    } else {
      firebase.initializeApp(cfg);
    }

    const auth = cfg?.apiKey ? firebase.auth()      : null;
    const db   = cfg?.apiKey ? firebase.firestore() : null;

    /* ── MAPPA ──────────────────────────────────────────────────────────── */
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/bright',
      center: [12.4964, 41.9028],
      zoom: 5,
      attributionControl: false
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

    let styleReady = false;
    map.on('load', () => {
      styleReady = true;
      map.addSource('trails', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'trails', type: 'line', source: 'trails',
        paint: { 'line-color': '#6366F1', 'line-width': 3, 'line-opacity': 0.65 },
        layout: { 'line-cap': 'round', 'line-join': 'round' }
      });
    });

    /* ── MARKER ─────────────────────────────────────────────────────────── */
    const markers = {};
    let firstFit  = false;

    function render(locs) {
      if (styleReady) {
        const feats = locs
          .filter(l => (l.recentPoints || []).length >= 2)
          .map(l => ({
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates: l.recentPoints.slice().sort((a,b) => a.t - b.t).map(p => [p.lo, p.la])
            }
          }));
        const src = map.getSource('trails');
        if (src) src.setData({ type: 'FeatureCollection', features: feats });
      }

      const seen   = new Set();
      const bounds = new maplibregl.LngLatBounds();
      let any = false;

      locs.forEach(l => {
        if (!l.latitude && !l.longitude) return;
        seen.add(l.userId);
        const spdKmh = Math.round((l.speed || 0) * 3.6);
        const label  = l.nickname || l.userName || 'Membro';

        if (!markers[l.userId]) {
          const el = document.createElement('div');
          el.className = 'marker';
          el.innerHTML = '<div class="dot"></div><div class="name"></div><div class="spd"></div>';
          markers[l.userId] = new maplibregl.Marker({ element: el })
            .setLngLat([l.longitude, l.latitude]).addTo(map);
        }
        const m  = markers[l.userId];
        m.setLngLat([l.longitude, l.latitude]);
        const el = m.getElement();
        el.querySelector('.name').textContent = label;
        el.querySelector('.spd').textContent  = spdKmh > 2 ? `${spdKmh} km/h` : '';
        bounds.extend([l.longitude, l.latitude]);
        any = true;
      });

      Object.keys(markers).forEach(uid => {
        if (!seen.has(uid)) { markers[uid].remove(); delete markers[uid]; }
      });

      if (any && !firstFit) {
        firstFit = true;
        try { map.fitBounds(bounds, { padding: 80, maxZoom: 16 }); } catch (_) {}
      }
    }

    /* ── LISTENER FIRESTORE ─────────────────────────────────────────────── */
    let unsubUser = null, unsubLoc = null;

    function listenGroup(gid) {
      if (unsubLoc) { unsubLoc(); unsubLoc = null; }
      if (!gid) { subEl.textContent = 'Nessun gruppo attivo'; return; }
      unsubLoc = db.collection('groups').doc(gid).collection('locations')
        .onSnapshot(snap => {
          const locs = snap.docs.map(d => {
            const x = d.data();
            return {
              userId:       x.userId || d.id,
              userName:     x.userName, nickname: x.nickname,
              latitude:     x.latitude  || 0,
              longitude:    x.longitude || 0,
              speed:        x.speed     || 0,
              recentPoints: (x.recentPoints || []).map(p => ({ la: p.la, lo: p.lo, t: p.t || 0 }))
            };
          });
          subEl.textContent = `${locs.length} ${locs.length === 1 ? 'membro' : 'membri'} · live`;
          render(locs);
        }, e => { subEl.textContent = 'Errore: ' + e.code; });
    }

    /* ── AUTH ────────────────────────────────────────────────────────────── */
    const loginBtn     = document.getElementById('loginBtn');
    const loginLabel   = document.getElementById('loginLabel');
    const loginSpinner = document.getElementById('loginSpinner');
    const loginG       = document.getElementById('loginG');
    const logoutBtn    = document.getElementById('logout-btn');

    loginBtn.onclick = () => {
      if (!auth) return;
      errEl.style.display = 'none';
      loginLabel.textContent   = 'Connessione…';
      loginSpinner.style.display = '';
      loginG.style.display     = 'none';
      loginBtn.disabled        = true;
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(e => {
          errEl.style.display = 'block';
          errEl.textContent   = 'Accesso fallito: ' + (e.code || e.message);
        })
        .finally(() => {
          loginLabel.textContent   = 'Accedi con Google';
          loginSpinner.style.display = 'none';
          loginG.style.display     = '';
          loginBtn.disabled        = false;
        });
    };

    logoutBtn.onclick = () => auth?.signOut();

    auth?.onAuthStateChanged(user => {
      const overlay = document.getElementById('overlay');
      if (user) {
        overlay.style.display = 'none';
        logoutBtn.style.display = '';
        if (unsubUser) unsubUser();
        unsubUser = db.collection('users').doc(user.uid).onSnapshot(doc => {
          const gid = doc.exists ? (doc.data().currentGroupId || null) : null;
          listenGroup(gid);
        }, e => { subEl.textContent = 'Errore: ' + e.code; });
      } else {
        overlay.style.display = 'flex';
        logoutBtn.style.display = 'none';
        subEl.textContent = '—';
        if (unsubUser) { unsubUser(); unsubUser = null; }
        if (unsubLoc)  { unsubLoc();  unsubLoc  = null; }
        render([]);
      }
    });
  </script>
</body>
</html>
